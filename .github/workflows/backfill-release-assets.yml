name: Backfill existing theme ZIP assets

on:
  # One-time trigger: adding this file to an Arena branch runs the backfill.
  # Remove the helper after the three historical releases are verified.
  push:
    branches:
      - "arena/**"
    paths:
      - .github/workflows/backfill-release-assets.yml

permissions:
  contents: write

jobs:
  package-and-attach:
    name: Backfill ${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: v1.7.29
            version: 1.7.29
          - tag: v1.7.30
            version: 1.7.30
          - tag: v1.7.31
            version: 1.7.31
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}
          persist-credentials: false

      - name: Confirm the matching published release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: gh release view "$RELEASE_TAG" >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up PHP for the complete project checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install locked dependencies
        run: npm ci

      - name: Run the full build and regression checks
        run: npm run check

      - name: Ensure the historical tag contains its committed build
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- assets/compiled)" ]]; then
            echo "The committed assets/compiled output does not match ${{ matrix.tag }}." >&2
            git diff --stat -- assets/compiled
            exit 1
          fi

      - name: Build and verify the installable theme archive
        env:
          RELEASE_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          actual_version="$(node -p "require('./package.json').version")"
          if [[ "$actual_version" != "$RELEASE_VERSION" ]]; then
            echo "Expected package.json $RELEASE_VERSION, got $actual_version." >&2
            exit 1
          fi
          npm run package
          test -s "artifacts/zarrin-${RELEASE_VERSION}.zip"

      - name: Upload, download and compare the release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.tag }}
          RELEASE_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          asset="artifacts/zarrin-${RELEASE_VERSION}.zip"
          asset_name="zarrin-${RELEASE_VERSION}.zip"
          gh release upload "$RELEASE_TAG" "$asset" --clobber
          mkdir -p "$RUNNER_TEMP/release-asset-check"
          gh release download "$RELEASE_TAG" --pattern "$asset_name" --dir "$RUNNER_TEMP/release-asset-check"
          cmp --silent "$asset" "$RUNNER_TEMP/release-asset-check/$asset_name"
          gh release view "$RELEASE_TAG" --json assets --jq ".assets[].name" | grep -Fx "$asset_name"
          echo "Verified $asset_name on release $RELEASE_TAG ($(stat -c '%s' "$asset") bytes)."
