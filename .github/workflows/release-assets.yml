name: Publish installable theme ZIP

on:
  # A release-version bump is the release signal. Handle release commits from
  # main and Arena work branches so publishing doesn't depend on the sandbox's
  # outbound connection to GitHub's upload host.
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - package.json
      - package-lock.json
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to package and backfill (for example v1.7.31)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-zip-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package-and-attach:
    name: Build, validate and attach release ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the event's exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve and validate release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name || '' }}
          DISPATCH_TAG: ${{ inputs.tag || '' }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            release_tag="$RELEASE_EVENT_TAG"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$DISPATCH_TAG"
          else
            version="$(node -p "require('./package.json').version")"
            previous_version=""
            if [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
              previous_version="$(git show "${EVENT_BEFORE}:package.json" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk).on('end', () => console.log(JSON.parse(input).version));")"
            fi
            if [[ -n "$previous_version" && "$version" == "$previous_version" ]]; then
              echo "Release skipped: package.json version remains $version."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            release_tag="v$version"
          fi
          if [[ ! "$release_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          version="${release_tag#v}"
          actual_version="$(node -p "require('./package.json').version")"
          if [[ "$actual_version" != "$version" ]]; then
            echo "Tag says $version but package.json says $actual_version." >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up PHP for the complete project checks
        if: steps.release.outputs.publish == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install locked dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm ci

      - name: Run the full build and regression checks
        if: steps.release.outputs.publish == 'true'
        run: npm run check

      - name: Ensure the tag contains its committed build
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- assets/compiled)" ]]; then
            echo "The committed assets/compiled output does not match the tagged source." >&2
            git diff --stat -- assets/compiled
            exit 1
          fi

      - name: Build and verify the installable theme archive
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          actual_version="$(node -p "require('./package.json').version")"
          if [[ "$actual_version" != "$RELEASE_VERSION" ]]; then
            echo "Expected package.json $RELEASE_VERSION, got $actual_version." >&2
            exit 1
          fi
          npm run package
          test -s "artifacts/zarrin-${RELEASE_VERSION}.zip"

      - name: Create the GitHub Release for a version-bump commit
        if: steps.release.outputs.publish == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          remote_refs="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          remote_tag="$(printf '%s\n' "$remote_refs" | awk '$2 ~ /\^\{\}$/ { peeled = $1; next } { direct = $1 } END { print peeled != "" ? peeled : direct }')"
          if [[ -n "$remote_tag" && "$remote_tag" != "$GITHUB_SHA" ]]; then
            echo "Refusing to publish $RELEASE_TAG: it already points to $remote_tag, not $GITHUB_SHA." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; the validated ZIP will be refreshed."
          else
            notes_file="$RUNNER_TEMP/release-notes.md"
            awk '/^## R[0-9]+/ { if (started) exit; started = 1 } started { print }' docs/FIXES.fa.md > "$notes_file"
            test -s "$notes_file"
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Zarrin $RELEASE_VERSION" \
              --notes-file "$notes_file"
          fi

      - name: Upload the ZIP to the matching GitHub Release and verify download
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          asset="artifacts/zarrin-${RELEASE_VERSION}.zip"
          asset_name="zarrin-${RELEASE_VERSION}.zip"
          gh release upload "$RELEASE_TAG" "$asset" --clobber
          mkdir -p "$RUNNER_TEMP/release-asset-check"
          gh release download "$RELEASE_TAG" --pattern "$asset_name" --dir "$RUNNER_TEMP/release-asset-check"
          cmp --silent "$asset" "$RUNNER_TEMP/release-asset-check/$asset_name"
          gh release view "$RELEASE_TAG" --json assets --jq ".assets[].name" | grep -Fx "$asset_name"
          echo "Verified $asset_name on release $RELEASE_TAG ($(stat -c '%s' "$asset") bytes)."
