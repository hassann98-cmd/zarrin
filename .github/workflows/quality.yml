name: Theme quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.3", "8.5"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
      - run: npm ci
      - name: Audit the locked root dependency tree
        run: npm audit --audit-level=moderate
      - run: npm run check
      - name: Committed build must match source
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- assets/compiled)" ]]; then
            echo 'Rebuild and include all of assets/compiled in this change.'
            git diff --stat -- assets/compiled
            exit 1
          fi
      - name: Build installable source and runtime archive
        if: matrix.php == '8.3'
        run: npm run package
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: zarrin-theme
          path: artifacts/zarrin-*.zip
          if-no-files-found: error
  wordpress-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.5"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: tests/integration/package-lock.json
      - name: Use the optional integration SDK's supported npm
        run: npm install --global npm@11.16.0
      - name: Install isolated integration tooling without lifecycle scripts
        run: npm ci --prefix tests/integration --ignore-scripts
      - name: Audit the locked integration dependency tree
        run: npm audit --prefix tests/integration --audit-level=moderate
      - name: Prepare checksum-pinned upstream test fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm --prefix tests/integration run prepare:fixtures
      - name: Exercise real WordPress and SQLite (no WooCommerce or external providers)
        env:
          ZARRIN_TEST_PHP: ${{ matrix.php }}
        run: npm run test:integration

  woocommerce-products:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: zarrin_test
          MYSQL_ROOT_PASSWORD: isolated-fixture-only
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-fixture-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom, gd, zip
          tools: wp-cli:2.12.0
          coverage: none
      - name: Install isolated pinned WordPress and WooCommerce
        shell: bash
        run: |
          set -euo pipefail
          run_cmd() {
            if "$@" > "$RUNNER_TEMP/wp-product-command.log" 2>&1; then
              cat "$RUNNER_TEMP/wp-product-command.log"
            else
              python3 -c 'import os,pathlib; s=pathlib.Path(os.environ["RUNNER_TEMP"]+"/wp-product-command.log").read_text(errors="replace")[-5000:]; p=os.environ.get("WP_TEST_ADMIN_PASSWORD",""); s=s.replace(p,"[test-password]") if p else s; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
              return 1
            fi
          }
          site="$RUNNER_TEMP/wordpress-products"
          run_cmd wp core download --version=6.9 --path="$site" --skip-content
          run_cmd wp config create --path="$site" --dbname=zarrin_test --dbuser=root --dbpass=isolated-fixture-only --dbhost=127.0.0.1:33306
          run_cmd wp config set DISABLE_WP_CRON true --raw --path="$site"
          run_cmd wp config set WP_DEBUG true --raw --path="$site"
          run_cmd wp config set WP_DEBUG_LOG true --raw --path="$site"
          run_cmd wp config set WP_DEBUG_DISPLAY false --raw --path="$site"
          password="$(openssl rand -hex 20)"
          export WP_TEST_ADMIN_PASSWORD="$password"
          run_cmd wp core install --path="$site" --url=http://wordpress.test --title='Isolated product regressions' --admin_user=fixture-admin --admin_password="$password" --admin_email=fixture@example.invalid --skip-email
          run_cmd curl --fail --location --retry 2 https://github.com/woocommerce/woocommerce/releases/download/11.1.2/woocommerce.zip -o "$RUNNER_TEMP/woocommerce.zip"
          printf '%s  %s\n' '697b54ebdc55f8c0de30ff41ffdb9fb5b0ca4e51132313b90c107632a79a0b8a' "$RUNNER_TEMP/woocommerce.zip" | sha256sum --check --strict -
          run_cmd wp config set WP_HTTP_BLOCK_EXTERNAL true --raw --path="$site"
          run_cmd wp plugin install "$RUNNER_TEMP/woocommerce.zip" --activate --path="$site"
          mkdir -p "$site/wp-content/themes/zarrin"
          rsync -a --exclude=.git --exclude=node_modules --exclude=.cache --exclude=artifacts --exclude=downloads --exclude=dist "$GITHUB_WORKSPACE/" "$site/wp-content/themes/zarrin/"
          run_cmd wp theme activate zarrin --path="$site"
      - name: Exercise real product defaults, badges, templates and post-add recommendations
        shell: bash
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/tests/woocommerce/product-regressions.php" --path="$RUNNER_TEMP/wordpress-products" --user=fixture-admin
      - name: Preserve isolated WordPress debug output for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woocommerce-products-debug
          path: ${{ runner.temp }}/wordpress-products/wp-content/debug.log
          if-no-files-found: ignore
