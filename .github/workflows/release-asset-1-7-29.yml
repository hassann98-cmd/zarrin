name: Temporary Zarrin 1.7.29 release asset upload
on:
  push:
    branches:
      - arena/01a0cf86-zarrin
permissions:
  contents: write
jobs:
  upload:
    if: startsWith(github.event.head_commit.message, 'Temporary release asset uploader for v1.7.29')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.7.29
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - name: Record the rebuilt archive digest
        id: package
        shell: bash
        run: |
          test -s artifacts/zarrin-1.7.29.zip
          actual="$(sha256sum artifacts/zarrin-1.7.29.zip | awk '{print $1}')"
          echo "GitHub runner package SHA-256: $actual"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"
      - name: Upload, verify GitHub digest, and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ steps.package.outputs.sha256 }}
        shell: bash
        run: |
          gh release upload v1.7.29 artifacts/zarrin-1.7.29.zip --repo "$GITHUB_REPOSITORY"
          expected="sha256:$EXPECTED_SHA256"
          actual="$(gh release view v1.7.29 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "zarrin-1.7.29.zip") | .digest')"
          echo "GitHub release asset digest: $actual"
          test "$actual" = "$expected"
          gh release edit v1.7.29 --draft=false --repo "$GITHUB_REPOSITORY"
